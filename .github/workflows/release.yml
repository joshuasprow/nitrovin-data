# The data release (ADR 0007 in joshuasprow/nitrovin). On every pull request:
# the package tests, then rebuild the embedded month from NHTSA's dump with the
# importer commit manifest.json names, and require the committed artifact and
# manifest byte for byte. On main, the same build, then tag
# v<format>.<YYYYMM>.<rebuild> on the built commit and publish its release:
# nitrovin-<month>.artifact, NHTSA's vPICList_lite_<month>.custom.zip,
# manifest.json, checksums.txt, and a cosign keyless bundle (<file>.sigstore.json,
# signed with this workflow's GitHub OIDC identity) for each of them. A
# release runs when dispatched on main, and when a push to main changes the
# embedded manifest: nitrovin's refresh (.github/workflows/refresh.yml there)
# pushes each gated month that way. A commit that names its refresh run
# (a "Refresh-Run: <run id>" trailer) also publishes that run's
# stale-cache.jsonl and parity-<month>.tar.gz (nitrovin's ADR 0006 and 0008)
# and epa-vehicles.jsonl, the EPA vocabulary the refresh built against the
# month and gated on `nitrovin vocab check` finding no fault.
name: Data release

on:
  pull_request:
  push:
    branches: [main]
    paths: [pkg/embedded/manifest.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

defaults:
  run:
    # Explicit bash adds -o pipefail, so `| tee` cannot hide a failure.
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # The custom dump is archive format 1.16: pg_restore 17 or newer.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vpic
          # Collate C, as nitrovin's scripts/oracle.sh up: restore refuses any
          # other collation, and manifest.json records it.
          POSTGRES_INITDB_ARGS: --lc-collate=C
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    outputs:
      month: ${{ steps.manifest.outputs.month }}
      format: ${{ steps.manifest.outputs.format }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: data

      - name: Read the manifest
        id: manifest
        run: jq -r '"month=\(.data_month)", "format=\(.format)", "commit=\(.importer.commit)"' data/pkg/embedded/manifest.json | tee -a "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: joshuasprow/nitrovin
          ref: ${{ steps.manifest.outputs.commit }}
          path: nitrovin

      - uses: actions/setup-go@v7
        with:
          go-version-file: data/go.mod
          cache-dependency-path: |
            data/go.sum
            nitrovin/go.sum

      - name: Test
        working-directory: data
        run: go test -count=1 ./...

      - name: Rebuild from the dump
        env:
          ORACLE_CONTAINER: ${{ job.services.postgres.id }}
        run: data/scripts/build.sh nitrovin "${{ steps.manifest.outputs.month }}" "$RUNNER_TEMP/release"

      - name: Require the committed bytes
        env:
          MONTH: ${{ steps.manifest.outputs.month }}
        run: |
          cmp "$RUNNER_TEMP/release/nitrovin-$MONTH.artifact" data/pkg/embedded/nitrovin.artifact
          diff -u data/pkg/embedded/manifest.json "$RUNNER_TEMP/release/manifest.json"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the tag and the release
      id-token: write # cosign keyless: the OIDC token Fulcio certifies
    env:
      GH_TOKEN: ${{ github.token }}
      MONTH: ${{ needs.build.outputs.month }}
      FORMAT: ${{ needs.build.outputs.format }}
      IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      # sigstore publishes no floating major tag (v4 does not resolve): pin the release.
      - uses: sigstore/cosign-installer@v4.1.3

      - name: Choose the tag
        id: tag
        run: |
          # v<format>.<YYYYMM>.<rebuild>: the rebuild counts this month's tags.
          prefix="v$FORMAT.${MONTH/_/}."
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$prefix")
          if done=$(jq -er --arg sha "$GITHUB_SHA" 'map(select(.object.sha == $sha))[0].ref' <<<"$refs"); then
            echo "release: $GITHUB_SHA is already released as ${done#refs/tags/}" >&2
            exit 1
          fi
          echo "tag=$prefix$(jq length <<<"$refs")" | tee -a "$GITHUB_OUTPUT"

      - name: The refresh's assets
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.message |
            sed -n 's/^Refresh-Run: \([0-9][0-9]*\)$/\1/p')
          if [ -z "$run" ]; then
            echo "release: $GITHUB_SHA names no refresh run"
            exit 0
          fi
          id=$(gh api "repos/joshuasprow/nitrovin/actions/runs/$run/artifacts?name=data-release-extras" --jq '.artifacts[0].id // ""')
          [ -n "$id" ] || { echo "release: nitrovin run $run has no data-release-extras artifact" >&2; exit 1; }
          gh api "repos/joshuasprow/nitrovin/actions/artifacts/$id/zip" >"$RUNNER_TEMP/extras.zip"
          unzip -o "$RUNNER_TEMP/extras.zip" -d release
          echo "REFRESH_RUN=$run" >>"$GITHUB_ENV"

      - name: Checksums and signatures
        working-directory: release
        run: |
          assets=(*)
          sha256sum "${assets[@]}" >checksums.txt
          for f in "${assets[@]}" checksums.txt; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
          ls -l

      - name: Publish
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "NHTSA vPIC data month **$MONTH** as nitrovin artifact format $FORMAT."
            echo
            echo '| | |'
            echo '| --- | --- |'
            jq -r '"| artifact | `nitrovin-\(.data_month).artifact`, \(.bytes) bytes, blake3 `\(.blake3)` |",
              "| dump | [`\(.dump.url | split("/") | last)`](\(.dump.url)), \(.dump.bytes) bytes, sha256 `\(.dump.sha256)` |",
              "| oracle | Postgres, collate \(.collate), ctype \(.ctype) |",
              "| importer | [`\(.importer.package)` at `\(.importer.commit[:12])`](https://github.com/joshuasprow/nitrovin/tree/\(.importer.commit)/\(.importer.package)) |"' \
              release/manifest.json
            if [ -n "${REFRESH_RUN:-}" ]; then
              echo "| refresh | [nitrovin run $REFRESH_RUN](https://github.com/joshuasprow/nitrovin/actions/runs/$REFRESH_RUN): built, and gated against the freshened oracle |"
              echo "| stale-cache | \`stale-cache.jsonl\`: $(wc -l <release/stale-cache.jsonl | tr -d ' ') calls on which the stock and freshened oracles differ |"
              echo "| parity key | \`parity-$MONTH.tar.gz\`: the frozen answer key (\`testdata/parity/$MONTH\`) |"
              if [ -r release/epa-vehicles.jsonl ]; then
                echo "| EPA vocabulary | \`epa-vehicles.jsonl\`: EPA's fuel-economy make and model names mapped onto this month, version \`$(head -1 release/epa-vehicles.jsonl | jq -r .version)\`, $(($(wc -l <release/epa-vehicles.jsonl) - 1)) entries; load it with \`nitrovin --vocab epa-vehicles.jsonl\` |"
              fi
            fi
            echo
            echo 'Every asset has a cosign keyless bundle. To verify one:'
            echo
            echo '```sh'
            echo "cosign verify-blob --bundle checksums.txt.sigstore.json \\"
            echo "  --certificate-identity $IDENTITY \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt"
            echo 'sha256sum -c checksums.txt'
            echo '```'
          } >notes.md
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
